name: profile cards

on:
  schedule:
    - cron: "15 6 * * *"   # daily, 06:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_cards.py", ".github/workflows/profile-cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/render_cards.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/langs-*.svg
          git diff --staged --quiet || git commit -m "cards: refresh profile stats"
          git push
